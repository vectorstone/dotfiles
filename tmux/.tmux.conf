# ==============================
# tmux 配置
# ==============================

# 1) 基础设置
# 启用鼠标：点击切 pane、拖拽调大小、滚轮滚动
set -g mouse on

# 统一滚轮每次 1 行（copy-mode emacs）
unbind -T copy-mode WheelUpPane
unbind -T copy-mode WheelDownPane
bind -T copy-mode WheelUpPane   select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

# 统一滚轮每次 1 行（copy-mode vi）
unbind -T copy-mode-vi WheelUpPane
unbind -T copy-mode-vi WheelDownPane
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

# 增大历史行数：避免长输出被截断
set -g history-limit 50000

# 降低 Esc 延迟：提升按键响应
set -sg escape-time 10

# 终端类型：启用 256 色
set -g default-terminal "screen-256color"

# 2) 状态栏
# 位置：底部
set -g status-position bottom

# 整体配色
set -g status-style 'bg=#1a1a2e fg=#888888'

# 左侧：会话名
set -g status-left '#[fg=#4ec9b0,bold] [#S] '
set -g status-left-length 20

# 右侧：时间
set -g status-right '#[fg=#666666] %H:%M '

# 当前窗口高亮
set -g window-status-current-style 'fg=#4ec9b0,bold'

# 3) Pane 边框
# 非活动 pane 边框
set -g pane-border-style 'fg=#333333'
# 活动 pane 边框
set -g pane-active-border-style 'fg=#4ec9b0'

# 4) 开发布局（仅当 new-session 带 -e mode=dev 时触发）
# 目标布局：右侧 1 个 pane + 左侧 2 个 pane（上小下大）
set-hook -g after-new-session 'run-shell "if [ \"$(tmux show-environment -t \"#{session_name}\" mode 2>/dev/null)\" = \"mode=dev\" ]; then pane_count=$(tmux list-panes -t \"#{session_name}:0\" 2>/dev/null | wc -l | tr -d \" \"); if [ \"\$pane_count\" = \"1\" ]; then tmux split-window -h -t \"#{session_name}:0.0\" -p 52; tmux split-window -v -t \"#{session_name}:0.0\" -p 65; tmux select-pane -t \"#{session_name}:0.0\"; tmux send-keys -t \"#{session_name}:0.0\" \"mo status\" C-m; fi; fi"'

# 5) 快捷键绑定
# Prefix + r：重载配置
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Prefix + |：左右分屏
bind | split-window -h
# Prefix + -：上下分屏
bind - split-window -v

# Opt/Option + 方向键：无 prefix 切 pane
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
