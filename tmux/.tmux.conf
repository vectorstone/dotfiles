# ==============================
# tmux 配置
# ==============================

# 1) 基础设置
# 启用鼠标：点击切 pane、拖拽调大小、滚轮滚动
set -g mouse on

# 复制命令：统一写入 macOS 系统剪贴板
# set -s copy-command 'pbcopy'

# 统一滚轮每次 1 行（copy-mode emacs）
unbind -T copy-mode WheelUpPane
unbind -T copy-mode WheelDownPane
bind -T copy-mode WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# 鼠标选中后复制，但保留在 copy-mode；
# 这样不会在松开鼠标后立刻跳回底部，可手动按 q / Esc 退出
unbind -T copy-mode MouseDragEnd1Pane
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe

# 统一滚轮每次 1 行（copy-mode vi）
unbind -T copy-mode-vi WheelUpPane
unbind -T copy-mode-vi WheelDownPane
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# 鼠标选中后复制，但保留在 copy-mode；
# 这样不会在松开鼠标后立刻跳回底部，可手动按 q / Esc 退出
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe

# 增大历史行数：避免长输出被截断
set -g history-limit 50000

# 降低 Esc 延迟：提升按键响应
set -sg escape-time 10

# 终端类型：启用 256 色
set -g default-terminal "screen-256color"

# 2) 状态栏
# 位置：顶部
set -g status-position top

# 整体配色
set -g status-style 'bg=#1a1a2e fg=#c8d3f5'

# 左侧：会话名
set -g status-left '#[fg=#4ec9b0,bold] [#S] '
set -g status-left-length 20

# 右侧：硬盘温度 + 时间
set -g status-right '#[fg=#666666]#{host_short} #[fg=#666666] %H:%M '
#set -g status-right '#[fg=#666666]#(/Users/wangxiaoguang/.config/tmux/disk_temp.sh) #[fg=#666666] %H:%M '
set -g status-interval 30

# 当前窗口高亮
set -g window-status-current-style 'fg=#4ec9b0,bold'

# 窗口列表：顶部 Tab 标签
# 使用 tmux 内建格式读取左上角 pane 的当前目录名，避免依赖 #() 外部命令。
set -g automatic-rename off
set -g allow-rename off
set -g status-justify left
set -g window-status-separator ''
#set -g window-status-format ' #[fg=#c8d3f5]#I:#(~/.config/tmux/window_name_from_left_path.sh #{window_id})#{?window_flags,#{window_flags},} '
#set -g window-status-current-format '#[bg=#4ec9b0,fg=#1a1a2e,bold] #I:#(~/.config/tmux/window_name_from_left_path.sh #{window_id})#{?window_flags,#{window_flags},} #[default]'
set -g window-status-format ' #[fg=#c8d3f5]#I:#{P:#{?#{&&:#{pane_at_left},#{pane_at_top}},#{=/30/...:#{b:pane_current_path}},}}#{?window_flags,#{window_flags},} '
set -g window-status-current-format '#[bg=#4ec9b0,fg=#1a1a2e,bold] #I:#{P:#{?#{&&:#{pane_at_left},#{pane_at_top}},#{=/30/...:#{b:pane_current_path}},}}#{?window_flags,#{window_flags},} #[default]'
set -g window-status-activity-style 'fg=#ffcc66,bold'
set -g window-status-bell-style 'fg=#ff5370,bold'

# 3) Pane 边框
# 非活动 pane 边框
set -g pane-border-style 'fg=#333333'
# 活动 pane 边框
set -g pane-active-border-style 'fg=#4ec9b0'
# 面板顶部标题栏：左侧固定显示当前 pane 的目录名，避免依赖 pane_title 在不同机器上行为不一致
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[fg=#4ec9b0],#[fg=#666666]} #{?pane_current_path,#{=/30/...:#{b:pane_current_path}},#{pane_title}} #[fg=#333333]─'

# 4) 开发布局（仅当 new-session 带 -e mode=dev 时触发）
# 目标布局：右侧 1 个 pane + 左侧 2 个 pane（上小下大）
set-hook -g after-new-session 'run-shell "if [ \"$(tmux show-environment -t \"#{session_name}\" mode 2>/dev/null)\" = \"mode=dev\" ]; then pane_count=$(tmux list-panes -t \"#{session_name}:0\" 2>/dev/null | wc -l | tr -d \" \"); if [ \"\$pane_count\" = \"1\" ]; then tmux split-window -h -t \"#{session_name}:0.0\" -p 52; tmux split-window -v -t \"#{session_name}:0.0\" -p 65; tmux select-pane -t \"#{session_name}:0.0\"; tmux send-keys -t \"#{session_name}:0.0\" \"mo status\" C-m; fi; fi"'

# 5) 快捷键绑定
# ctrl + b = prefix
# Prefix + r：重载配置
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Prefix + |：左右分屏 后面的pane_current_path是为了确保分屏之后的窗口的目录和当前的窗口一致
bind | split-window -h -c "#{pane_current_path}"
# Prefix + -：上下分屏
bind - split-window -v -c "#{pane_current_path}"

# Opt/Option + 方向键：无 prefix 切 pane
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# 6) 插件
# 安装 TPM 后会自动加载；未安装时不影响 tmux 启动
set -g @plugin 'tmux-plugins/tmux-sensible'
if-shell -b '[ -d ~/.tmux/plugins/tpm ]' 'run-shell ~/.tmux/plugins/tpm/tpm'
